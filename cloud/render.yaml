services:
  - type: web
    name: ai-personal-diet-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_MODE
        value: supabase
      - key: STORAGE_MODE
        value: supabase
      
      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_KEY
        sync: false

      - key: SUPABASE_SERVICE_KEY
        sync: false

      - key: SUPABASE_BUCKET
        value: user-files
     
      - key: CORS_ORIGINS
        value: "*"
